# Dedicated estimator training configuration. Edit this file, then source difficulty/scripts/train.sh.
# Existing settings retained; dataset references migrated to the active schema-2 source.
schema_version: 2
run:
  attempt_id: auto
  mode: fit
data:
  dataset_id: resolved-migration331-20261024
  expected_receipt_sha256: null
  split:
    strategy: event_random_v1
    seed: 42
    validation_fraction: 0.15
    test_fraction: 0.15
  targets:
  - submission_remaining_steps_log1p
  - submission_remaining_steps_linear
  - submission_remaining_reasoning_tokens_log1p
  - submission_remaining_reasoning_tokens_linear
features:
  public_site: 3
model:
  kind: ffn_mlp
  mlp:
    hidden_dims:
    - 1024
    - 1024
    activation: gelu
    normalization: layernorm
    dropout: 0.1
training:
  epochs: 10000
  batch_size: 256
  seed: 42
  device: auto
  torch_threads: 4
  loss: mse
  optimizer:
    kind: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  early_stopping:
    patience: 100
    min_delta: 0.0
  scheduler:
    enabled: true
    kind: reduce_on_plateau
    factor: 0.5
    patience: 5
    threshold: 0.0001
    min_lr: 1.0e-06
tensorboard:
  enabled: true
  host: 127.0.0.1
  port: 6006
  flush_secs: 5
  reload_interval: 5
  keep_after_training: true
