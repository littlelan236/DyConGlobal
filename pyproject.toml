[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dycon-global"
version = "0.1.0"
description = "Causal trajectory and latent analysis infrastructure for coding agents"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "pydantic>=2,<3", "requests>=2,<3", "numpy>=2,<3", "packaging>=23"]

[project.optional-dependencies]
rl = ["torch==2.13.0", "transformers==5.17.0", "peft==0.21.2", "accelerate==1.15.0", "safetensors==0.8.0"]
runner = ["ijson==3.5.1", "docker>=7,<8", "mini-swe-agent==2.4.5", "swebench==4.1.0"]
analysis = ["ijson==3.5.1", "tensorboard==2.20.0", "torch>=2.7", "transformers>=5,<6", "accelerate>=1", "matplotlib>=3.9", "safetensors>=0.5", "scikit-learn==1.7.2", "umap-learn==0.5.9.post2"]
action = ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
test = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
dycon = "core.cli:main"

[project.entry-points."vllm.endpoint_plugins"]
dycon_capture = "runtime.serving.vllm_plugin:plugin"

[project.entry-points."vllm.general_plugins"]
dycon_capture = "runtime.serving.cache_boundary:install"

[tool.setuptools.packages.find]
where = ["."]
include = ["RL*", "core*", "application*", "catalog*", "rollout*", "benchmark_evaluation*", "diagnostics*", "enrichment*", "hidden*", "difficulty*", "action*", "steering*", "runtime*"]
exclude = ["tests*", "vendor*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_images.py" = ["E402"]

[tool.setuptools.package-data]
RL = ["fixtures/*.json", "experiments/*.yaml"]
"RL.dataset" = ["configs/*.yaml"]

"runtime.agents" = ["verifier_contracts.json", "verifier_package_metadata.json"]
