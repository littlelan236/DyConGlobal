# Prepare the dataset first; this example defaults to dry-run.
schema_version: 1
run:
  attempt_id: key-step-adaptive-grpo-001
  mode: dry-run
  seed: 42
  start:
    mode: fresh
    checkpoint: null
model:
  path: /VM/wangtianyi/DyConGlobal/models/Qwen3.5-9B
  dtype: bfloat16
  attention_backend: sdpa
  gradient_checkpointing: true
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_scope: text_backbone_all_linear
runtime:
  gpu: 4
  output_root: /data3/wangtianyi/DyConGlobal
training:
  max_updates: null  # derived from complete nonzero-variance parents and epochs
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  weight_decay: 0.0
  grad_clip: 1.0
  scheduler: constant
  checkpoint_every_updates: 10
  checkpoint_policy: layer
  memory:
    loss_chunk_tokens: 16
    exact_length: true
validation:
  fixture_id: causal-text-smoke-v1
  max_sequence_length: 2048  # memory estimate, not permission to truncate native inputs
  stop_after_update: null
algorithm:
  name: key_step_grpo_v1
key_steps:
  dataset: RL/datasets/key-step-adaptive
  epochs: 1
  groups_per_update: 1
  seed: 42
  max_trace_input_tokens: 32768
  max_trace_completion_tokens: null
objective:
  kl:
    computation: recompute
    beta: 0.02
    k3_cap: 1.0
  ppo:
    clip_epsilon: 0.1
