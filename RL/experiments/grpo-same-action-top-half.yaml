# Set model/dataset paths, attempt ID, GPU IDs and the preflight-reported max_updates.
schema_version: 1
run:
  attempt_id: grpo-same-action-001
  mode: dry-run
  seed: 42
  start:
    mode: fresh
model:
  path: /VM/wangtianyi/DyConGlobal/models/Qwen3.5-9B
  dtype: bfloat16
  attention_backend: sdpa
  gradient_checkpointing: true
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_scope: text_backbone_all_linear
runtime:
  gpus: [0, 1]
  topology_policy: preserve_updates
  output_root: /data3/wangtianyi/DyConGlobal
training:
  max_updates: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  scheduler: constant
  checkpoint_every_updates: 1
  memory:
    loss_chunk_tokens: 16
    exact_length: true
validation:
  fixture_id: causal-text-smoke-v1
  max_sequence_length: 512
preflight:
  validate_dataset: true
  verify_identity: true
algorithm:
  name: offline_grpo_k3_v1
  dataset_root: /data3/wangtianyi/DyConGlobal
  dataset_id: DATASET_ID
  require_data_ready: true
grpo:
  advantage_policy: same_action_top_half_v1
  group_batch_size: 8
  top_k: null
  top_k_fraction: 0.5
  boundary_tie_sigma: 0.0
